<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hoods v0.9.4</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}button{font-family:system-ui,sans-serif;font-weight:800}#game{position:fixed;inset:0}.mobile-gamepad{position:fixed;z-index:50;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.joystick{width:112px;height:112px;border-radius:50%;border:1px solid #87917c88;background:#0b0f0a77;box-shadow:inset 0 0 22px #0008,0 4px 18px #0005;position:relative;pointer-events:auto;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#d7dfcfbb;border:2px solid #f1f4edaa;box-shadow:0 4px 12px #0008;transform:translate(0,0);transition:transform .06s linear}.actions{display:flex;gap:8px;pointer-events:auto}.actions button,#dialogueBox button{border:1px solid #8b947f;background:#0b0f0aaa;color:#b9ef5a;border-radius:14px;touch-action:none;box-shadow:0 3px 12px #0005}.actions button{width:54px;height:54px;font-size:11px}.actions button:active,#dialogueBox button:active{background:#304126e8;border-color:#b9ef5a;transform:scale(.95)}.badge{position:fixed;z-index:60;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:6px 8px;border-radius:8px;background:#0c100bcc;color:#b9ef5a;font:700 10px monospace}@media(min-width:900px){.mobile-gamepad{display:none}}</style></head><body><div id="game"></div><div class="badge">v0.9.4 MOBILE</div><div class="mobile-gamepad"><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><div class="actions"><button id="talkBtn">TALK</button><button id="bagBtn">BAG</button><button id="atkBtn">ATK</button></div></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="v092-game.js?v=0930"></script><script>(()=>{const joy=document.getElementById('joystick'),stick=document.getElementById('stick');const down=new Set();const keyMap={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};function key(dir,on){const k=keyMap[dir];if(on&&!down.has(dir)){down.add(dir);window.dispatchEvent(new KeyboardEvent('keydown',{key:k,code:k,bubbles:true}))}else if(!on&&down.has(dir)){down.delete(dir);window.dispatchEvent(new KeyboardEvent('keyup',{key:k,code:k,bubbles:true}))}}function release(){['up','down','left','right'].forEach(d=>key(d,false));stick.style.transform='translate(0,0)'}function move(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=34,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;const dead=10;key('left',dx<-dead);key('right',dx>dead);key('up',dy<-dead);key('down',dy>dead)}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))move(e)});joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);function mobileCamera(){if(innerWidth>=900)return;const g=Phaser.GAMES?.[0],s=g?.scene?.scenes?.[0];if(s?.cameras?.main)s.cameras.main.setZoom(innerWidth<500?.54:.72)}setTimeout(mobileCamera,700);addEventListener('resize',()=>setTimeout(mobileCamera,80));})();</script></body></html>
