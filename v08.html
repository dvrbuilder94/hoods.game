<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hoods v0.8 Pure Migration</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}#game{position:fixed;inset:0}.mobile-gamepad{position:fixed;z-index:50;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;pointer-events:auto}.dpad button{border:1px solid #8b947f;background:#11150ddd;color:#eee;font-size:20px;font-weight:900;border-radius:12px;touch-action:none}.dpad button.active{background:#304126;border-color:#b9ef5a}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.badge{position:fixed;z-index:60;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:6px 8px;border-radius:8px;background:#0c100bcc;color:#b9ef5a;font:700 10px monospace}@media(min-width:900px){.mobile-gamepad{display:none}}</style></head><body><div id="game"></div><div class="badge">v0.8 PURE</div><div class="mobile-gamepad"><div class="dpad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="v08-game.js?v=0802"></script></body></html>
