cript><script>(()=>{const pad=document.getElementById('pad'),nub=document.getElementById('nub');let active=null;function scene(){return Phaser.GAMES?.[0]?.scene?.scenes?.[0]}function stop(){const s=scene();if(s?.touch)Object.assign(s.touch,{up:false,down:false,left:false,right:false});nub.style.transform='translate(0px,0px)';active=null}function move(e){const s=scene();if(!s?.touch)return;const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy)||1,max=38;if(len>max){dx=dx/len*max;dy=dy/len*max}nub.style.transform=`translate(${dx}px,${dy}px)`;const dead=8;s.touch.left=dx<-dead;s.touch.right=dx>dead;s.touch.up=dy<-dead;s.touch.down=dy>dead}pad.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;try{pad.setPointerCapture(active)}catch{}move(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===active){e.preventDefault();move(e)}});pad.addEventListener('pointerup',e=>{if(e.pointerId===active)stop()});pad.addEventListener('pointercancel',stop);window.addEventListener('blur',stop);function camera(){if(innerWidth>=900)return;const s=scene();if(!s?.cameras?.main)return;const portrait=innerHeight>innerWidth;s.cameras.main.setZoom(portrait?.58:.72);s.cameras.main.setFollowOffset(0,portrait?-18:0)}setTimeout(camera,650);addEventListener('resize',()=>setTimeout(camera,100));})();</script></body></html>
