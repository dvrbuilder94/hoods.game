<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hoods v1.0.9</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}#game{position:fixed;inset:0}.mobile-gamepad{position:fixed;z-index:9998;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:5px;pointer-events:auto;opacity:.95}.dpad button,.actions button{border:1px solid #8b947f;background:#0b0f0af2;color:#eee;font-weight:900;border-radius:14px;touch-action:none;box-shadow:0 3px 12px #0008;pointer-events:auto}.dpad button{font-size:18px}.dpad button.active,.actions button:active{background:#304126f2;border-color:#b9ef5a;transform:scale(.95)}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:flex;gap:7px;pointer-events:auto}.actions button{width:50px;height:50px;font:800 10px system-ui;color:#b9ef5a}.badge{position:fixed;z-index:9999;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:5px 7px;border-radius:8px;background:#0c100bb8;color:#f4d35e;font:700 9px monospace;pointer-events:none}@media(min-width:900px){.mobile-gamepad{display:none}}</style></head><body><div id="game"></div><div class="badge">v1.0.9 TOUCH CAPTURE</div><div class="mobile-gamepad"><div class="dpad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down
