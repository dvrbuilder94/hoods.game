<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hoods v0.9.5</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}button{font-family:system-ui,sans-serif;font-weight:800}#game{position:fixed;inset:0}.joystick-zone{position:fixed;z-index:50;left:0;bottom:0;width:52vw;height:42vh;pointer-events:auto;touch-action:none}.joystick{position:absolute;width:94px;height:94px;margin:-47px;border-radius:50%;border:1px solid #87917c77;background:#0b0f0a70;box-shadow:inset 0 0 18px #0008,0 3px 15px #0005;display:none}.joystick.on{display:block}.stick{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:#d7dfcfc9;border:2px solid #f1f4edaa;box-shadow:0 3px 10px #0008}.actions{position:fixed;z-index:51;right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:7px}.actions button,#dialogueBox button{border:1px solid #8b947f;background:#0b0f0aa8;color:#b9ef5a;border-radius:14px;touch-action:none;box-shadow:0 3px 12px #0005}.actions button{width:50px;height:50px;font-size:10px}.actions button:active,#dialogueBox button:active{background:#304126e8;border-color:#b9ef5a;transform:scale(.95)}.badge{position:fixed;z-index:60;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:5px 7px;border-radius:8px;background:#0c100baa;color:#b9ef5a;font:700 9px monospace}@media(min-width:900px){.joystick-zone,.actions{display:none}}</style></head><body><div id="game"></div><div class="badge">v0.9.5 MOBILE+</div><div id="joyZone" class="joystick-zone"><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div></div><div class="actions"><button id="talkBtn">TALK</button><button id="bagBtn">BAG</button><button id="atkBtn">ATK</button></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="v092-game.js?v=0930"></script><script>(()=>{const zone=document.getElementById('joyZone'),joy=document.getElementById('joystick'),stick=document.getElementById('stick');const down=new Set(),keys={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};let pid=null,cx=0,cy=0;function key(d,on){const k=keys[d];if(on&&!down.has(d)){down.add(d);window.dispatchEvent(new KeyboardEvent('keydown',{key:k,code:k,bubbles:true}))}else if(!on&&down.has(d)){down.delete(d);window.dispatchEvent(new KeyboardEvent('keyup',{key:k,code:k,bubbles:true}))}}function release(){['up','down','left','right'].forEach(d=>key(d,false));joy.classList.remove('on');stick.style.transform='translate(0,0)';pid=null}function move(e){let dx=e.clientX-cx,dy=e.clientY-cy;const max=29,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;const dead=7;key('left',dx<-dead);key('right',dx>dead);key('up',dy<-dead);key('down',dy>dead)}zone.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;zone.setPointerCapture(pid);cx=e.clientX;cy=e.clientY;const zr=zone.getBoundingClientRect();joy.style.left=(cx-zr.left)+'px';joy.style.top=(cy-zr.top)+'px';joy.classList.add('on');move(e)});zone.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e)});zone.addEventListener('pointerup',e=>{if(e.pointerId===pid)release()});zone.addEventListener('pointercancel',release);function camera(){if(innerWidth>=900)return;const s=Phaser.GAMES?.[0]?.scene?.scenes?.[0];if(!s?.cameras?.main)return;const portrait=innerHeight>innerWidth;s.cameras.main.setZoom(portrait?.46:.64);s.cameras.main.setFollowOffset(0,portrait?-38:0)}setTimeout(camera,650);addEventListener('resize',()=>setTimeout(camera,100));})();</script></body></html>
