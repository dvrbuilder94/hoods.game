<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hoods v0.9.7</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}#game{position:fixed;inset:0}.dpad{position:fixed;z-index:70;left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}.dpad button,.actions button{font:800 16px system-ui;border:1px solid #89927e;background:#0b0f0ab8;color:#eee;border-radius:14px;touch-action:none;box-shadow:0 3px 12px #0006}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad button.on{background:#34452be8;border-color:#b9ef5a}.actions{position:fixed;z-index:71;right:max(12px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:8px}.actions button{width:52px;height:52px;font-size:10px;color:#b9ef5a}.badge{position:fixed;z-index:72;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:5px 7px;border-radius:8px;background:#0c100bb8;color:#b9ef5a;font:700 9px monospace}@media(min-width:900px){.dpad,.actions{display:none}}</style></head><body><div id="game"></div><div class="badge">v0.9.7 FIX</div><div class="dpad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><div class="actions"><button id="talkBtn">TALK</button><button id="bagBtn">BAG</button><button id="atkBtn">ATK</button></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="v092-game.js?v=0970"></script><script>(()=>{function cam(){if(innerWidth>=900)return;const s=Phaser.GAMES?.[0]?.scene?.scenes?.[0];if(s?.cameras?.main){s.cameras.main.setZoom(innerHeight>innerWidth?.60:.74);s.cameras.main.setFollowOffset(0,-14)}}setTimeout(cam,700);addEventListener('resize',()=>setTimeout(cam,100));document.querySelectorAll('[data-move]').forEach(b=>{['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,()=>b.classList.add('on'),{passive:true}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on'),{passive:true}))})})();</script></body></html>
