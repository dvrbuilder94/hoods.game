<style>

nset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:min(92vw,410px);max-height:min(72dvh,620px);padding:11px;background:var(--panel);border:1px solid #59634f;border-radius:11px;box-shadow:0 10px 35px #000a;backdrop-filter:blur(9px);overflow:auto;touch-action:pan-y}#v2Bag[hidden]{display:none}.bag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid #343b30}.bag-head small{display:block;color:var(--acid);font:900 8px monospace;letter-spacing:.12em}.bag-head h2{margin:2px 0 0;font-size:16px}.bag-head button{width:31px;height:31px;background:#11170e;border:1px solid #55604d;color:#eee9d3;font-size:18px}.v2-bag-layout{display:grid;grid-template-columns:145px 1fr;gap:10px;align-items:start}.v2-set{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(4,43px);gap:4px}.v2-slot{position:relative;width:43px;height:43px;padding:2px;background:linear-gradient(145deg,#151c12,#0a0e09);border:1px solid #46503f;color:#dfe4d5;overflow:hidden}.v2-slot.filled{border-color:#718f68}.v2-slot small{position:absolute;left:2px;right:2px;bottom:2px;font:700 5.5px monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9aa392}.v2-slot>span:not(.gear-icon){font:900 6.5px monospace;color:#5f695a}.slot-helmet{grid-column:2;grid-row:1}.slot-weapon{grid-column:1;grid-row:2}.slot-armor{grid-column:2;grid-row:2}.slot-shield{grid-column:3;grid-row:2}.slot-legs{grid-column:2;grid-row:3}.slot-boots{grid-column:2;grid-row:4}.v2-section{margin-bottom:10px}.v2-section-title{margin-bottom:5px;color:#8f9988;font:900 8px monospace;letter-spacing:.1em}#v2Outfit{display:flex;gap:5px;flex-wrap:wrap}#v2Outfit button{padding:6px 8px;background:#11160e;border:1px solid #46503f;color:#aaa;font:800 8px monospace}#v2Outfit button.selected{color:#111;background:var(--acid);border-color:var(--acid)}#v2BagItems{display:grid;gap:4px}.v2-item{display:grid;grid-template-columns:28px 1fr auto;a
