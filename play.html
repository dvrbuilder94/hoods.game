<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hoods V2</title>
<style>
:root{color-scheme:dark;--ink:#eee9d3;--acid:#b9ef5a;--panel:#0c100bf2;--line:#4b5544}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d09;font-family:Inter,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}#hoods-v2-root{position:fixed;inset:0;width:100vw;height:100dvh}.v2-hud{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;padding:7px 9px;background:#0b0e0acc;border:1px solid #3f4938;border-radius:8px;font:800 10px monospace;pointer-events:none;backdrop-filter:blur(4px)}.v2-hud b{color:var(--acid)}.v2-hud em{font-style:normal;color:#a6ad9c}.v2-gamepad{position:fixed;z-index:22;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.v2-dpad,.v2-actions{pointer-events:auto}.v2-dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}.v2-dpad button,.v2-actions button{background:#0b0e0ad9;border:1px solid #7a8670;color:#f1eedc;box-shadow:0 3px 12px #0007;touch-action:none;-webkit-user-select:none;user-select:none}.v2-dpad button{border-radius:12px;font-size:20px}.v2-dpad button:active,.v2-dpad button.active{transform:scale(.96);border-color:var(--acid);background:#273320e8}.v2-up{grid-column:2}.v2-left{grid-column:1;grid-row:2}.v2-down{grid-column:2;grid-row:2}.v2-right{grid-column:3;grid-row:2}.v2-actions{display:flex;gap:8px}.v2-actions button{width:60px;height:60px;border-radius:50%;font:900 11px monospace}.v2-actions .bag{background:#182016e8;border-color:#8ea07b}#v2Bag{position:fixed;z-index:40;inset:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));padding:14px;background:var(--panel);border:1px solid #59634f;border-radius:12px;backdrop-filter:blur(8px);overflow:auto}#v2Bag[hidden]{display:none}.bag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid #343b30}.bag-head small{display:block;color:var(--acid);font:900 9px monospace;letter-spacing:.12em}.bag-head h2{margin:3px 0 0;font-size:18px}.bag-head button{width:34px;height:34px;background:#11170e;border:1px solid #55604d;color:#eee9d3;font-size:20px}.v2-bag-layout{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start}.v2-set{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(4,48px);gap:5px}.v2-slot{position:relative;width:48px;height:48px;padding:2px;background:#11160e;border:1px solid #46503f;color:#dfe4d5;overflow:hidden}.v2-slot strong{display:block;font-size:23px;line-height:30px}.v2-slot small{position:absolute;left:2px;right:2px;bottom:2px;font:700 6px monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8f9988}.v2-slot span{font:900 7px monospace;color:#5f695a}.slot-helmet{grid-column:2;grid-row:1}.slot-weapon{grid-column:1;grid-row:2}.slot-armor{grid-column:2;grid-row:2}.slot-shield{grid-column:3;grid-row:2}.slot-legs{grid-column:2;grid-row:3}.slot-boots{grid-column:2;grid-row:4}.v2-section{margin-bottom:12px}.v2-section-title{margin-bottom:6px;color:#8f9988;font:900 9px monospace;letter-spacing:.1em}#v2Outfit{display:flex;gap:6px}#v2Outfit button{padding:7px 9px;background:#11160e;border:1px solid #46503f;color:#aaa;font:800 9px monospace}#v2Outfit button.selected{color:#111;background:var(--acid);border-color:var(--acid)}#v2BagItems{display:grid;gap:5px}.v2-item{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;padding:8px;background:#11160e;border:1px solid #343b30;color:#e8e4d0;text-align:left}.v2-item .ico{font-size:21px}.v2-item span:nth-child(2){display:grid}.v2-item small{color:#80897a;font:700 8px monospace}.v2-item strong{color:var(--acid);font:900 8px monospace}.v2-empty{color:#6e7769;font:800 9px monospace;padding:9px}@media(max-width:520px){.v2-bag-layout{grid-template-columns:150px 1fr;gap:8px}.v2-set{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(4,44px);gap:4px}.v2-slot{width:44px;height:44px}.v2-item{grid-template-columns:26px 1fr auto;padding:7px}.v2-item .ico{font-size:18px}}
</style>
</head>
<body>
<div id="hoods-v2-root"></div>
<div class="v2-hud"><b>HOODS V2</b><em>TOWN SQUARE</em><span id="v2Coins">120c</span><span id="v2Stats">ATK 5 DEF 3</span></div>
<div class="v2-gamepad"><div class="v2-dpad"><button class="v2-up" data-v2-move="up">▲</button><button class="v2-left" data-v2-move="left">◀</button><button class="v2-down" data-v2-move="down">▼</button><button class="v2-right" data-v2-move="right">▶</button></div><div class="v2-actions"><button id="v2BagBtn" class="bag">BAG</button></div></div>
<section id="v2Bag" hidden><div class="bag-head"><div><small>CLASSIC SET</small><h2>Equipment</h2></div><button id="v2CloseBag">×</button></div><div class="v2-bag-layout"><div><div class="v2-section-title">SET</div><div id="v2Set" class="v2-set"></div></div><div><div class="v2-section"><div class="v2-section-title">OUTFIT — VISUAL ONLY</div><div id="v2Outfit"></div></div><div class="v2-section-title">BACKPACK</div><div id="v2BagItems"></div></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="hoods-v2.js?v=v2b"></script>
</body></html>
