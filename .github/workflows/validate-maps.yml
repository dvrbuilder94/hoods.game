name: Validate Hoods contracts

on:
  push:
    branches: [main]
    paths:
      - 'maps/**'
      - 'assets/maps/**'
      - 'phaser-*.js'
      - 'phaser.html'
      - 'systems/**'
      - 'scripts/**'
      - '.github/workflows/validate-maps.yml'
  pull_request:
    paths:
      - 'maps/**'
      - 'assets/maps/**'
      - 'phaser-*.js'
      - 'phaser.html'
      - 'systems/**'
      - 'scripts/**'
      - '.github/workflows/validate-maps.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Tilemap and manifest contracts
        run: node scripts/validate-maps.mjs
      - name: Parse-check Phaser runtimes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -name 'phaser-*.js' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find systems -name '*.js' -print0)
